name: Release

on:
  push:
    # A tag with a suffix, such as 2.0.0-rc.1, publishes a prerelease for testing.
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check that the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "version mismatch" >&2
            exit 1
          fi

      - name: Check that the updater signing secrets are set
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set; the updater artifacts cannot be signed."
              missing=1
            fi
          done
          exit "$missing"

  create-release:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
          BODY: 'Build for macOS on Apple silicon, with poppler included. See the README for first-launch steps.'
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="$TAG" -f body="$BODY" -F draft=true -F prerelease="$PRERELEASE" --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      # The app runs pdftotext and pdftoppm from Contents/Resources/poppler; the bundle
      # script copies them and their libraries into build/poppler from Homebrew.
      - name: Bundle poppler
        run: |
          brew install poppler
          npm run bundle:poppler

      - run: npm ci

      # Also signs the updater bundle (the .app.tar.gz) and uploads latest.json to the release.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # The notes of latest.json; the release body comes from create-release.
          releaseBody: 'Build for macOS on Apple silicon, with poppler included. See the README for first-launch steps.'
          # A prerelease has no latest.json, so installed apps never update to it.
          uploadUpdaterJson: ${{ !contains(github.ref_name, '-') }}
          args: --config '{"bundle":{"createUpdaterArtifacts":true,"targets":["app","dmg"],"resources":{"../build/poppler":"poppler"}}}'
