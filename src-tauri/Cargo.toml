[package]
name = "concilia"
version = "2.0.0"
description = "Bank statement reconciliation desktop app"
authors = ["Sérgio Santos"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.94"
publish = false

[lib]
name = "concilia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Exposes test doubles to integration tests.
test-support = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# Native TLS like the rest of the app; macOS installs the .app.tar.gz without the zip feature.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
tauri-plugin-process = "2"
keyring = "4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4.34"
thiserror = "2.0.21"
percent-encoding = "2.3"
regex = "1.11"
indexmap = "2"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util", "fs"] }
tokio-util = "0.7.20"
futures = "0.3.34"
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "gzip", "http2", "charset", "system-proxy", "form"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
base64 = "0.23.1"
rust_xlsxwriter = "0.99.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
# The crate itself with test doubles enabled, for the integration tests.
concilia = { path = ".", features = ["test-support"] }
tokio = { version = "1.53.2", features = ["test-util"] }
wiremock = "0.6.5"
calamine = "0.36.1"
# Generates throwaway RSA keys for the service account tests.
rsa = { version = "0.9", features = ["pem", "getrandom"] }

[lints.clippy]
all = "deny"
